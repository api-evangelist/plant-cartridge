aid: plant-cartridge
name: Plant Cartridge
description: Plant Cartridge is a Malaysian ag-tech company modernizing sustainable agriculture
  with modular growing systems for indoor and vertical farming. It designs and builds growing
  environments, supplies growing systems, and offers managed services to cultivate leafy
  vegetables, herbs, and fruiting vegetables with a faster growth rate while saving water,
  nutrients, and growing media. Headquartered in Petaling Jaya, Selangor with operations at
  Technology Park Malaysia in Kuala Lumpur, the company empowers farmers in the ag-tech
  transformation to help secure the food future. Surfaced as a portfolio company of 500 Global,
  Plant Cartridge publishes a marketing and news website but no public developer or API surface
  at this time.
